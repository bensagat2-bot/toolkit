name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.publish-release.outputs.release_id }}
    steps:
      - name: Create or reuse nightly release
        id: publish-release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          retries: 5
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tagName = 'nightly';
            const releaseBody = [
              '## V1Per Servicing Toolkit nightly',
              '',
              'Built from the latest push to `main`.',
              '',
              '### Downloads',
              '',
              '- Windows: `.exe` installer',
            ].join('\n');

            async function create() {
              return github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tagName,
                name: 'V1Per nightly',
                body: releaseBody,
                draft: false,
                prerelease: false,
                generate_release_notes: false,
                target_commitish: context.sha,
              });
            }

            try {
              const response = await create();
              core.setOutput('release_id', String(response.data.id));
              return;
            } catch (error) {
              if (error.status === 422) {
                // Release already exists - reuse it so nightly builds keep uploading.
                const existing = await github.rest.repos.getReleaseByTag({ owner, repo, tag: tagName });
                core.setOutput('release_id', String(existing.data.id));
                return;
              }
              // Transient server errors (502/503): give the retry helper a chance
              // to rerun create() before falling back to the existing release.
              const fallback = await github.rest.repos.getReleaseByTag({ owner, repo, tag: tagName });
              core.setOutput('release_id', String(fallback.data.id));
            }

  build:
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm install

      - name: Build and upload Tauri app
        uses: tauri-apps/tauri-action@v0.5.24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          retryAttempts: 2
          tauriScript: npx tauri
          args: --bundles nsis
