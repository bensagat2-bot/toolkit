name: Build & Release

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Get version
        id: version
        shell: bash
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Electron app dependencies
        run: npx electron-builder install-app-deps

      - name: Build
        run: npm run build

      - name: Package Windows installer
        run: npm run pack:win:setup:x64

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: build/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: installer
          path: installer

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.build.outputs.version }}-build.${{ github.run_number }}
          name: V1Per v${{ needs.build.outputs.version }} (build ${{ github.run_number }})
          body: |
            Auto-built from ${{ github.sha }} on the ${{ github.ref_name }} branch.
          files: installer/*.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}