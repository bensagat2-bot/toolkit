name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.publish-release.outputs.release_id }}
      tag: ${{ steps.publish-release.outputs.tag }}
    steps:
      - name: Create per-build release
        id: publish-release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          retries: 5
          retry-exempt-status-codes: 400,401,403,404,409,422
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const start = new Date();
            const pad = (n) => String(n).padStart(2, '0');
            const stamp = `${start.getUTCFullYear()}.${pad(start.getUTCMonth() + 1)}.${pad(start.getUTCDate())}-${pad(start.getUTCHours())}${pad(start.getUTCMinutes())}${pad(start.getUTCSeconds())}`;

            const releaseBody = [
              '## V1Per Servicing Toolkit nightly',
              '',
              'Built from the latest push to `main`.',
              '',
              '### Downloads',
              '',
              '- Windows: `.exe` installer',
            ].join('\n');

            let tagName = `nightly-${stamp}`;
            let release;
            for (let attempt = 0; attempt < 5; attempt++) {
              try {
                const response = await github.rest.repos.createRelease({
                  owner,
                  repo,
                  tag_name: tagName,
                  name: `V1Per nightly ${stamp}`,
                  body: releaseBody,
                  draft: false,
                  prerelease: false,
                  generate_release_notes: false,
                  target_commitish: context.sha,
                });
                release = response.data;
                break;
              } catch (error) {
                if (error.status !== 422) throw error;
                tagName = `nightly-${stamp}-${attempt + 1}`;
              }
            }
            if (!release) throw new Error('could not create release');

            core.setOutput('release_id', String(release.id));
            core.setOutput('tag', tagName);

  build:
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm install

      - name: Build and upload Tauri app
        uses: tauri-apps/tauri-action@v0.5.24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          retryAttempts: 2
          tauriScript: npx tauri
          args: --bundles nsis
